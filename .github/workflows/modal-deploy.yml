name: Deploy Gemma API to Modal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Modal deployments update the same App, so run them one at a time.
concurrency:
  group: modal-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deployment dependencies
        run: python -m pip install --upgrade modal httpx

      - name: Deploy Modal app
        run: modal deploy modal_gemma.py
